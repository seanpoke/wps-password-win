name: Build and Package

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build on Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
        include-prerelease: false

    - name: Restore dependencies
      run: dotnet restore WpsPasswordManager/WpsPasswordManager.csproj
      working-directory: ${{ github.workspace }}
      continue-on-error: false
      id: restore

    - name: Publish the project
      run: dotnet publish WpsPasswordManager/WpsPasswordManager.csproj --configuration Release --no-restore --self-contained true --runtime win-x64 --property:OutputPath=bin/Release/net6.0-windows/win-x64/publish
      working-directory: ${{ github.workspace }}
      continue-on-error: false
      id: publish
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: true

    - name: List publish output
      run: Get-ChildItem -Path "WpsPasswordManager/bin/Release/net6.0-windows/win-x64/publish" -Recurse -Name
      working-directory: ${{ github.workspace }}
      id: list-output

    - name: Create archive with version and timestamp
      run: |
        $version = "1.0.0"
        $timestamp = Get-Date -Format "yyyyMMddHHmm"
        $archiveName = "文档密码管理_${version}_${timestamp}.zip"
        $publishDir = "WpsPasswordManager/bin/Release/net6.0-windows/win-x64/publish"
        Compress-Archive -Path "$publishDir/*" -DestinationPath "$archiveName" -Force
        Write-Output "Archive created: $archiveName"
      working-directory: ${{ github.workspace }}
      id: create-archive

    - name: Upload publish artifacts
      uses: actions/upload-artifact@v4
      with:
        name: 文档密码管理
        path: |
          *.zip
        if-no-files-found: error
      id: upload-artifact

    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          **/*.log
          **/bin/**/*.pdb
        if-no-files-found: ignore