name: Build and Package

on:
  # 保留原有的 push/pull_request 触发方式
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # 新增手动触发（核心！）
  workflow_dispatch:
    # 可选：手动触发时可配置输入参数，这里给你加个示例
    inputs:
      build_reason:
        description: '触发原因（手动构建用）'
        required: false
        default: '手动触发构建'
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build on Windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'
        include-prerelease: false

    - name: Restore dependencies
      run: dotnet restore PasswordManager/PasswordManager.csproj
      working-directory: ${{ github.workspace }}
      continue-on-error: false
      id: restore

    - name: Publish the project
      run: dotnet publish PasswordManager/PasswordManager.csproj --configuration Release --no-restore --self-contained true --runtime win-x64 --property:OutputPath=bin/Release/net6.0-windows/win-x64/publish
      working-directory: ${{ github.workspace }}
      continue-on-error: false
      id: publish
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: true

    - name: List publish output
      run: Get-ChildItem -Path "PasswordManager/bin/Release/net6.0-windows/win-x64/publish" -Recurse -Name
      working-directory: ${{ github.workspace }}
      id: list-output

    - name: Create archive with version and timestamp
      run: |
        $version = "1.0.0"
        $timestamp = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), "China Standard Time") | Get-Date -Format "yyyyMMddHHmm"
        $archiveName = "文档密码管理_${version}_${timestamp}"
        $publishDir = "PasswordManager/bin/Release/net6.0-windows/win-x64/publish"
        Push-Location $publishDir
        Compress-Archive -Path .\* -DestinationPath "${env:GITHUB_WORKSPACE}\${archiveName}.zip" -Force
        Pop-Location
        Write-Output "::set-output name=archiveName::$archiveName"
        Write-Output "Archive created: ${archiveName}.zip"
      working-directory: ${{ github.workspace }}
      id: create-archive

    - name: Upload publish artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.create-archive.outputs.archiveName }}
        path: |
          *.zip
        if-no-files-found: error
      id: upload-artifact

    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          **/*.log
          **/bin/**/*.pdb
        if-no-files-found: ignore
